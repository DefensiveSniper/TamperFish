<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    h2 {
      font-size: 14px;
      color: #f0f6fc;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      width: 100%;
      padding: 9px 0;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .btn-primary:hover { background: #2ea043; }

    .divider {
      border: none;
      border-top: 1px solid #21262d;
      margin: 4px 0 14px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .setting-label {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
    }

    .setting-label strong {
      display: block;
      color: #c9d1d9;
      font-size: 13px;
      margin-bottom: 2px;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: #30363d;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #8b949e;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    input:checked + .slider { background: #1f6feb; }
    input:checked + .slider::before {
      transform: translateX(18px);
      background: #fff;
    }

    .hint {
      font-size: 11px;
      color: #484f58;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>🐟 TamperFish</h2>

  <button class="btn-primary" id="openSidePanel">打开侧边栏控制台</button>

  <hr class="divider">

  <div class="setting-row">
    <div class="setting-label">
      <strong>内嵌浮窗</strong>
      在 goofish.com 页面内显示浮动面板
    </div>
    <label class="toggle">
      <input type="checkbox" id="embeddedToggle">
      <span class="slider"></span>
    </label>
  </div>

  <p class="hint" id="hint">切换后请刷新 goofish.com 标签页生效。</p>

  <script src="popup.js"></script>
</body>
</html>
